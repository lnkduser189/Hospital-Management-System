
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Appointment | MediCare Hospital</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- Header -->

    <header>

        <div class="logo">
            🏥 MediCare Hospital
        </div>

        <nav>

            <a href="../index.html">Home</a>

            <a href="doctors.html">Doctors</a>

            <a href="appointment.html" class="active">Book Appointment</a>

            <a href="appointments.html">My Appointments</a>

        </nav>

    </header>

    <!-- Page Title -->

    <section class="page-title">

        <h1>Book an Appointment</h1>

        <p>
            Fill in your details below to schedule your appointment.
        </p>

    </section>

    <section class="appointment-section">

    <form id="appointmentForm">

        <h2>📅 Book Your Appointment</h2>

        <div class="form-group">

            <label for="name">👤 Patient Name</label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required>

        </div>

        <div class="form-group">

            <label for="email">📧 Email Address</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required>

        </div>

        <div class="form-group">

            <label for="doctor">🩺 Select Doctor</label>

            <select id="doctor" required>

                <option value="">Choose Doctor</option>

                <option>Dr. Sharma - Cardiologist</option>

                <option>Dr. Priya - Dermatologist</option>

                <option>Dr. Rahul - Neurologist</option>

            </select>

        </div>

        <div class="form-group">

            <label for="date">📅 Appointment Date</label>

            <input
                type="date"
                id="date"
                required>

        </div>

        <div class="form-group">

            <label for="time">⏰ Appointment Time</label>

            <input
                type="time"
                id="time"
                required>

        </div>

        <button type="submit">
            Book Appointment
        </button>

    </form>

</section>

    <!-- Footer -->

    <footer>

        <h3>MediCare Hospital</h3>

        <p>
            Providing Quality Healthcare Services
        </p>

        <p>
            © 2026 All Rights Reserved
        </p>

    </footer>

    <script src="../js/script.js"></script>

</body>

</html>
