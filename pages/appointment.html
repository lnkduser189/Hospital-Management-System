<section id="appointment">

<h2>
Book Appointment
</h2>


<form id="appointmentForm">


<input 
type="text"
id="name"
placeholder="Patient Name"
required>


<input
type="email"
id="email"
placeholder="Email"
required>



<select id="doctor">

<option>
Dr. Sharma - Cardiologist
</option>

<option>
Dr. Priya - Dermatologist
</option>

<option>
Dr. Rahul - Neurologist
</option>

</select>



<input
type="date"
id="date"
required>



<input
type="time"
id="time"
required>



<button type="submit">
Book Appointment
</button>


</form>


</section>


<script src="../js/script.js"></script>
